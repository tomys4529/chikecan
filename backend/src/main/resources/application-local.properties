# ローカル開発・テスト用。H2をメモリDBとして使用する。
# MODE=PostgreSQL: Flywayマイグレーション(PostgreSQL方言)との互換性を高めるため
# DB_CLOSE_DELAY=-1: JVM稼働中はメモリDBを保持し続けるため(切断のたびにDBが消えるのを防ぐ)
spring.datasource.url=jdbc:h2:mem:chikecan;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ローカルはHTTPのためCookieのSecureを無効化する
server.servlet.session.cookie.secure=false
app.security.cookie-secure=false

# メール認証機能: ローカルでは実SMTPを必須にせず、認証URLをログへ出力するだけにする。
app.mail.enabled=false
app.mail.from=no-reply@chikecan.local
# フロントエンドの開発サーバーのURL。認証メール内のリンク・Googleログイン成功後の
# リダイレクト先の組み立てに使用する。
app.base-url=http://localhost:5173

# Googleログイン(OpenID Connect)。実際の値を設定しなくても(空文字のダミー値のままでも)
# アプリ自体は起動・テストできるが、実際にGoogleログインを試す場合はGoogle Cloud Consoleで
# 発行したクライアントID/シークレットを、環境変数またはこのファイルとは別の手段で設定すること。
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-dummy-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-dummy-client-secret}
