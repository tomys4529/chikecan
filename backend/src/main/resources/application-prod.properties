# 本番環境用。PostgreSQLへ接続する。
# 接続情報は環境変数から取得し、値をここへ直接記載しない。
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 本番はHTTPSのためCookieのSecureを有効化する
server.servlet.session.cookie.secure=true
app.security.cookie-secure=true

# Render無料枠のメモリ制約・Neon無料枠の同時接続数制約を考慮し、コネクションプールを絞る
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# メール認証機能: 本番はResend REST API(HTTPS)経由で送信する。
# Render Freeプラン等ではSMTPポート(25/465/587)への外向き通信がブロックされるため、
# SMTP(JavaMailSender)からHTTPS REST API方式(ResendMailClient)へ移行した。
# APIキーは環境変数から取得し、値をここへ直接記載しない。
app.mail.enabled=true
app.mail.from=${MAIL_FROM}
# フロントエンドの本番URL。認証メール内のリンク組み立てに使用する。
app.base-url=${APP_BASE_URL}
resend.api-key=${RESEND_API_KEY}
